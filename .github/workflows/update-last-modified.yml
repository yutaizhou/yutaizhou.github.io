name: Update last modified date

on:
  push:
    branches: [main]

jobs:
  update-date:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update last modified date
        env:
          COMMIT_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          DATE=$(date -u -d "$COMMIT_DATE" +"%B %d, %Y" | sed 's/ 0/ /')
          sed -i "s|<span id=\"last-updated\">.*</span>|<span id=\"last-updated\">${DATE}</span>|" index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Update last modified date [skip ci]"
          git push
